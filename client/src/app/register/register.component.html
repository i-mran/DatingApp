    <form #registerForm="ngForm" (ngSubmit)="register()" autocomplete="off">
        <h2 class="text-center text-primary">Sign Up</h2>
        <hr>
        <div class="mb-3">
            <input type="text" class="form-control mb-3" placeholder="Username" name="username" [(ngModel)]="model.username">
       
            <input type="password" class="form-control mb-3" placeholder="Password" name="password" [(ngModel)]="model.password">
        </div>
        <div class="text-center">
            <button class="btn btn-success me-2" type="submit">Register</button>
            <button class="btn btn-default" type="button" (click)="cancel()">Cancel</button>

        </div>
    </form>
